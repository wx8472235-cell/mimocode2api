services:
  mimocode2api:
    build: .
    image: mimocode2api:latest
    container_name: mimocode2api
    restart: unless-stopped
    ports:
      - "${MIMOCODE_HOST_PORT:-8080}:8080"
    environment:
      MIMOCODE_CLIENT_FILE: /data/client
      MIMOCODE_MODEL: mimo-auto
      RUST_LOG: info,mimocode2api=debug
    volumes:
      - mimocode2api-data:/data

volumes:
  mimocode2api-data:
