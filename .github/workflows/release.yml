name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: 构建 ${{ matrix.target }} 二进制
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,   use_cross: false, archive: tar.gz }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,  use_cross: true,  archive: tar.gz }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  use_cross: true,  archive: tar.gz }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, use_cross: true,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,       use_cross: false, archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,        use_cross: false, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     use_cross: false, archive: zip }

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 安装 cross 交叉编译工具
        if: matrix.use_cross
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cross

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: 编译 release 二进制
        shell: bash
        env:
          USE_CROSS: ${{ matrix.use_cross }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$USE_CROSS" = "true" ]; then
            cross build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi

      - name: 打包二进制
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          STAGING="mimocode2api-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$STAGING"
          if [ "$ARCHIVE" = "zip" ]; then
            BIN="mimocode2api.exe"
          else
            BIN="mimocode2api"
          fi
          cp "target/${TARGET}/release/${BIN}" "$STAGING/"
          cp README.md LICENSE "$STAGING/"

          if [ "$ARCHIVE" = "zip" ]; then
            7z a "${STAGING}.zip" "$STAGING"
          else
            tar czf "${STAGING}.tar.gz" "$STAGING"
          fi
          ls -lh "${STAGING}."*

      - name: 上传二进制到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mimocode2api-*-${{ matrix.target }}.tar.gz
            mimocode2api-*-${{ matrix.target }}.zip

  release-notes:
    name: 生成发行说明
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 从提交历史生成变更说明
        shell: bash
        run: |
          set -euo pipefail
          CUR="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${CUR}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${CUR}"
            LINK="https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${CUR}"
          else
            RANGE="${CUR}"
            LINK="https://github.com/${GITHUB_REPOSITORY}/commits/${CUR}"
          fi
          {
            echo "## ${CUR}"
            echo
            git log --no-merges --reverse --pretty=tformat:'%H' "$RANGE" | while read -r sha; do
              echo "**$(git log -1 --pretty=format:'%s' "$sha")**"
              echo
              body="$(git log -1 --pretty=format:'%b' "$sha")"
              if [ -n "$body" ]; then
                echo "$body"
                echo
              fi
            done
            echo "**完整变更**:${LINK}"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 写入发行说明
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md

  docker:
    name: 构建并推送镜像到 ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
